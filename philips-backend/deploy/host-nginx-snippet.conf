# Phillips Consulting TMS — temporary demo API.
#
# Add this INSIDE the existing `server { ... server_name api.colat.ng; }` block
# in /etc/nginx/sites-available/colat, ABOVE that block's catch-all
# `location / { proxy_pass http://127.0.0.1:8000; }`.
#
# nginx matches the longest prefix, so /tms/... lands here while every other
# path still reaches the colat FastAPI untouched.
#
# Why a sub-path of an existing host rather than a new subdomain: TLS is
# terminated upstream by the provider's Traefik on the hypervisor, which
# forwards plain HTTP to this guest. Adding a new hostname would need DNS and
# Traefik changes off-box; borrowing api.colat.ng inherits working HTTPS today.
# That matters because the frontend is HTTPS on Vercel, and a plain-http API
# would be blocked as mixed content.
#
# Apply with:  sudo nginx -t && sudo systemctl reload nginx
#
# Resulting base URL:  https://api.colat.ng/tms

# Answer /tms as well as /tms/. absolute_redirect off keeps the Location header
# relative — nginx listens on :80 here, so building an absolute URL would
# downgrade the client from https to http.
location = /tms {
    absolute_redirect off;
    return 301 /tms/;
}

location /tms/ {
    # The trailing slash strips "/tms" before the request reaches the app, so
    # APP_PATH_PREFIX in the API's .env must stay EMPTY.
    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Bearer tokens travel in this header; pass it through untouched.
    proxy_pass_header Authorization;

    proxy_connect_timeout 30s;
    proxy_read_timeout    60s;
}
