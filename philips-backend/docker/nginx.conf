server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Never serve the app's own source, config or session files.
    location ~ ^/(src|config|storage|bin|docker)/ {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Single front controller: everything is routed by public/index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Bearer tokens arrive here; some FPM builds drop this header otherwise.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_read_timeout 60;
    }

    # Block any other attempt to execute a PHP file directly.
    location ~ \.php$ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/tms-access.log;
    error_log  /var/log/nginx/tms-error.log warn;
}
