# Phillips Consulting TMS — temporary demo API.
#
# Runs as its own stack in its own directory, sharing nothing with the inspirtag
# services on the same host: separate containers, separate network, no database.
# Published on 127.0.0.1:8090 only — the host nginx proxies it under TLS.

services:
  app:
    image: php:8.3-fpm-alpine
    container_name: phillips-tms-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    mem_limit: 512m
    networks:
      - phillips-tms

  web:
    image: nginx:alpine
    container_name: phillips-tms-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    mem_limit: 128m
    networks:
      - phillips-tms
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first inside the
      # container and nginx would have to be listening on IPv6 to answer it.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  phillips-tms:
    driver: bridge
