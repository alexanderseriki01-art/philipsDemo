<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Phillips Consulting TMS</title>

    <!--
        The public marketing site lives at phillipsconsulting.net. This deployment
        is the internal training-management console, so the root goes straight to
        the admin sign-in. Vercel also redirects "/" to "/admin/" (see
        vercel.json); this file is the fallback for anyone opening the directory
        directly.
    -->
    <meta http-equiv="refresh" content="0; url=admin/" />
    <link rel="canonical" href="admin/" />

    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            background: #0a0c10;
            color: #8c9bb4;
            font: 400 14px/1.6 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
            letter-spacing: 0.01em;
        }
        a { color: #6ea0ff; }
    </style>
</head>
<body>
    <p>Redirecting to the admin console… <a href="admin/">Continue</a></p>
    <script>window.location.replace('admin/');</script>
</body>
</html>
